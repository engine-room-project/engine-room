name: Governance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  invariants:
    name: Governance / invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate governance structure
        run: sh scripts/ci/validate-governance.sh
      - name: Reject oversized files added by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/hooks/check-large-files.sh --range "$BASE_SHA" "$HEAD_SHA"

  secrets:
    name: Governance / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "/tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
      - name: Scan repository history for secrets
        run: /tmp/gitleaks detect --source . --redact --no-banner --config .gitleaks.toml

  actions-security:
    name: Governance / actions-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: medium
          min-confidence: medium

  project:
    name: Project / checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run project lint, test, and build checks
        run: sh scripts/ci/project-checks.sh
